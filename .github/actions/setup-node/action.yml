name: Setup Node
description: Install pnpm + Node.js and run pnpm install with caching.
inputs:
  node-version:
    description: Optional Node.js version override for compatibility checks.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: true
    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
